name: Validate knowledge content

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false
      - run: node --test
      - run: node scripts/validate-docs-manifest.mjs .
      - run: node scripts/validate-terminology.mjs .
      - run: node scripts/check-translation-freshness.mjs .
      - run: node scripts/build-docs-center.mjs --out dist
      - run: node scripts/validate-docs-center.mjs --out dist
      - name: Build recovered 0.8 candidate (validation only)
        run: node scripts/build-recovered-docs-center.mjs --out dist-recovered
      - name: Audit recovered reader capabilities (diagnostic)
        run: node scripts/audit-recovered-reader-capabilities.mjs --out dist-recovered
      - name: Inspect final reader/download contract (diagnostic)
        shell: bash
        run: |
          set -euo pipefail
          echo '--- browser availability ---'
          command -v google-chrome || true
          command -v google-chrome-stable || true
          command -v chromium || true
          command -v chromium-browser || true
          google-chrome --version 2>/dev/null || true
          chromium --version 2>/dev/null || true
          echo '--- FC direct-page final scripts ---'
          tail -n 40 dist-recovered/documents/fc/index.html || true
          echo '--- document reader download logic ---'
          grep -nE 'documentDownloads|download|PDF|pdf' dist-recovered/src/pages/document-reader.js || true
          echo '--- runtime download data source ---'
          cat dist-recovered/src/data/document-downloads.js || true
          echo '--- controls initialization/click markers ---'
          grep -nE 'initializeDocumentReaderControls|data-(copy-document-link|print-document|download|document-history)|addEventListener|clipboard|window\.print' dist-recovered/src/ui/document-reader-controls.js || true
          echo '--- download manifest ---'
          cat dist-recovered/downloads/document-downloads.json || true
      - name: Validate recovered 0.8 candidate
        run: node scripts/validate-recovered-docs-center.mjs --out dist-recovered
