name: Validate knowledge content

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false
      - run: node --test
      - run: node scripts/validate-docs-manifest.mjs .
      - run: node scripts/validate-terminology.mjs .
      - run: node scripts/check-translation-freshness.mjs .
      - run: node scripts/build-docs-center.mjs --out dist
      - run: node scripts/validate-docs-center.mjs --out dist
