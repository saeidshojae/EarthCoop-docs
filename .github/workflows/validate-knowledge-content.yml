name: Validate knowledge content

on:
  pull_request:
    paths:
      - "docs-manifest.json"
      - "schemas/knowledge-document.schema.json"
      - "scripts/validate-docs-manifest.mjs"
      - "tests/validate-docs-manifest.test.mjs"
      - "**/*.mdx"
  push:
    branches: [main]
    paths:
      - "docs-manifest.json"
      - "schemas/knowledge-document.schema.json"
      - "scripts/validate-docs-manifest.mjs"
      - "tests/validate-docs-manifest.test.mjs"
      - "**/*.mdx"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test tests/validate-docs-manifest.test.mjs
      - run: node scripts/validate-docs-manifest.mjs .
