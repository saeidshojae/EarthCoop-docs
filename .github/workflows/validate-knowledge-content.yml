name: Validate knowledge content

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false
      - name: Materialize authorized effective v1 release candidate
        if: github.event_name == 'pull_request' && github.head_ref == 'legal/foundational-effective-v1-20261001'
        run: node scripts/build-effective-v1-release.mjs .
      - run: node --test
      - run: node scripts/validate-docs-manifest.mjs .
      - run: node scripts/validate-terminology.mjs .
      - run: node scripts/check-translation-freshness.mjs .
      - run: node scripts/build-docs-center.mjs --out dist
      - run: node scripts/validate-docs-center.mjs --out dist
      - name: Build recovered 0.8 candidate (validation only)
        run: node scripts/build-recovered-docs-center.mjs --out dist-recovered
      - name: Validate recovered 0.8 candidate
        run: node scripts/validate-recovered-docs-center.mjs --out dist-recovered
      - name: Upload effective v1 materialization for registration commit
        if: github.event_name == 'pull_request' && github.head_ref == 'legal/foundational-effective-v1-20261001'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: effective-v1-registration-${{ github.sha }}
          path: |
            releases/foundational/2026-10-01/
            document-registry.json
            docs-manifest.json
          if-no-files-found: error
          retention-days: 3
      - name: Commit validated effective v1 registration snapshot
        if: github.event_name == 'pull_request' && github.head_ref == 'legal/foundational-effective-v1-20261001'
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          git add releases/foundational/2026-10-01 document-registry.json docs-manifest.json
          if git diff --cached --quiet; then
            echo "Effective v1 registration snapshot already committed."
            exit 0
          fi
          git config user.name "earthcoop-legal-bot"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "docs(legal): register effective foundational v1 snapshot"
          git push origin "HEAD:${BRANCH}"
