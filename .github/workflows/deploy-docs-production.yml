name: Deploy docs production

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Full commit SHA or immutable ref to deploy
        required: true
        type: string
      confirmation:
        description: Type DEPLOY DOCS PRODUCTION to continue
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: docs-production
  cancel-in-progress: false

jobs:
  deploy-production:
    runs-on: ubuntu-latest
    steps:
      - name: Require explicit production confirmation
        shell: bash
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          [ "$CONFIRMATION" = "DEPLOY DOCS PRODUCTION" ] || { echo "::error::Exact production confirmation is required"; exit 1; }

      - name: Checkout requested source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_ref }}
          persist-credentials: false
          fetch-depth: 1

      - name: Capture exact source SHA
        shell: bash
        run: echo "SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Run repository test suite
        run: node --test
      - name: Validate knowledge manifest
        run: node scripts/validate-docs-manifest.mjs .
      - name: Validate terminology
        run: node scripts/validate-terminology.mjs .
      - name: Check translation freshness
        run: node scripts/check-translation-freshness.mjs .
      - name: Build recovered Production candidate
        run: node scripts/build-recovered-docs-center.mjs --out dist-production --target production --canonical-origin https://docs.earthcoop.ir --source-sha "$SOURCE_SHA"
      - name: Validate recovered Production candidate
        run: node scripts/validate-recovered-production-artifact.mjs --out dist-production --source-sha "$SOURCE_SHA"

      - name: Upload exact Production rollback artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docs-production-${{ env.SOURCE_SHA }}
          path: dist-production/
          if-no-files-found: error
          retention-days: 90
          include-hidden-files: true

      - name: Preflight Production FTPS secrets
        shell: bash
        env:
          DOCS_PROD_FTP_SERVER: ${{ secrets.DOCS_PROD_FTP_SERVER }}
          DOCS_PROD_FTP_USERNAME: ${{ secrets.DOCS_PROD_FTP_USERNAME }}
          DOCS_PROD_FTP_PASSWORD: ${{ secrets.DOCS_PROD_FTP_PASSWORD }}
          DOCS_PROD_FTP_SERVER_DIR: ${{ secrets.DOCS_PROD_FTP_SERVER_DIR }}
        run: |
          set -euo pipefail
          missing=0
          for name in DOCS_PROD_FTP_SERVER DOCS_PROD_FTP_USERNAME DOCS_PROD_FTP_PASSWORD DOCS_PROD_FTP_SERVER_DIR; do
            if [ -z "${!name}" ]; then echo "::error::$name is not configured"; missing=1; fi
          done
          [ "$missing" -eq 0 ] || exit 1
          case "$DOCS_PROD_FTP_SERVER_DIR" in */) ;; *) echo "::error::DOCS_PROD_FTP_SERVER_DIR must end with /"; exit 1 ;; esac

      - name: Deploy exact candidate over strict FTPS
        uses: SamKirkland/FTP-Deploy-Action@110f9186c050f71550953127052e77650219c287 # v4.4.0
        with:
          server: ${{ secrets.DOCS_PROD_FTP_SERVER }}
          username: ${{ secrets.DOCS_PROD_FTP_USERNAME }}
          password: ${{ secrets.DOCS_PROD_FTP_PASSWORD }}
          protocol: ftps
          security: strict
          local-dir: ./dist-production/
          server-dir: ${{ secrets.DOCS_PROD_FTP_SERVER_DIR }}
          dangerous-clean-slate: false
          log-level: standard

      - name: Verify exact live Production manifest
        shell: bash
        run: |
          set -euo pipefail
          live_manifest="$(mktemp)"
          for attempt in {1..12}; do
            if curl --fail --silent --show-error --connect-timeout 10 --max-time 20 -H 'Cache-Control: no-cache' \
              "https://docs.earthcoop.ir/deployment-manifest.json?sha=${SOURCE_SHA}&attempt=${attempt}" -o "$live_manifest"; then
              if node - "$live_manifest" "$SOURCE_SHA" <<'NODE'
          const fs = require('fs');
          const [file, expectedSha] = process.argv.slice(2);
          const manifest = JSON.parse(fs.readFileSync(file, 'utf8'));
          if (manifest.sourceSha !== expectedSha) process.exit(1);
          if (manifest.runtimeBaseline !== 'earthcoop-knowledge-center-0.8.0') process.exit(1);
          if (manifest.deploymentTarget !== 'production') process.exit(1);
          if (manifest.indexing !== 'enabled') process.exit(1);
          if (manifest.canonicalOrigin !== 'https://docs.earthcoop.ir') process.exit(1);
          NODE
              then exit 0; fi
            fi
            sleep 5
          done
          echo "::error::Live Production manifest verification failed after bounded retries"
          exit 1
