name: Deploy independent docs preview

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-preview
  cancel-in-progress: false

jobs:
  deploy-preview:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout approved source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Run repository test suite
        run: node --test

      - name: Validate knowledge manifest
        run: node scripts/validate-docs-manifest.mjs .

      - name: Validate terminology
        run: node scripts/validate-terminology.mjs .

      - name: Check translation freshness
        run: node scripts/check-translation-freshness.mjs .

      - name: Build recovered Docs Center 0.8
        run: node scripts/build-recovered-docs-center.mjs --out dist

      - name: Validate recovered build identity
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs');
          const manifest = JSON.parse(fs.readFileSync('dist/deployment-manifest.json', 'utf8'));
          if (manifest.sourceSha !== process.env.GITHUB_SHA) {
            throw new Error(`deployment manifest SHA mismatch: ${manifest.sourceSha}`);
          }
          if (manifest.runtimeBaseline !== 'earthcoop-knowledge-center-0.8.0') {
            throw new Error(`unexpected runtime baseline: ${manifest.runtimeBaseline}`);
          }
          if (!fs.existsSync('dist/index.html')) throw new Error('dist/index.html is missing');
          if (!fs.existsSync('dist/src/content/document-packages/foundational.generated.fa.js')) {
            throw new Error('generated foundational package is missing');
          }
          NODE

      - name: Upload rollback artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docs-preview-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 30

      - name: Preflight FTPS secrets
        shell: bash
        env:
          DOCS_FTP_SERVER: ${{ secrets.DOCS_FTP_SERVER }}
          DOCS_FTP_USERNAME: ${{ secrets.DOCS_FTP_USERNAME }}
          DOCS_FTP_PASSWORD: ${{ secrets.DOCS_FTP_PASSWORD }}
          DOCS_FTP_SERVER_DIR: ${{ secrets.DOCS_FTP_SERVER_DIR }}
        run: |
          set -euo pipefail
          missing=0
          for name in DOCS_FTP_SERVER DOCS_FTP_USERNAME DOCS_FTP_PASSWORD DOCS_FTP_SERVER_DIR; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not configured"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
          case "$DOCS_FTP_SERVER_DIR" in
            */) ;;
            *) echo "::error::DOCS_FTP_SERVER_DIR must end with /"; exit 1 ;;
          esac

      - name: Deploy recovered dist to preview over strict FTPS
        uses: SamKirkland/FTP-Deploy-Action@110f9186c050f71550953127052e77650219c287 # v4.4.0
        with:
          server: ${{ secrets.DOCS_FTP_SERVER }}
          username: ${{ secrets.DOCS_FTP_USERNAME }}
          password: ${{ secrets.DOCS_FTP_PASSWORD }}
          protocol: ftps
          security: strict
          local-dir: ./dist/
          server-dir: ${{ secrets.DOCS_FTP_SERVER_DIR }}
          dangerous-clean-slate: false
          log-level: standard

      - name: Verify live preview recovered baseline and source SHA
        shell: bash
        run: |
          set -euo pipefail
          live_manifest="$(mktemp)"
          for attempt in {1..12}; do
            if curl --fail --silent --show-error \
              --connect-timeout 10 --max-time 20 \
              -H 'Cache-Control: no-cache' \
              "https://docs-preview.earthcoop.ir/deployment-manifest.json?sha=${GITHUB_SHA}&attempt=${attempt}" \
              -o "$live_manifest"; then
              if node - "$live_manifest" "$GITHUB_SHA" <<'NODE'
          const fs = require('fs');
          const [file, expectedSha] = process.argv.slice(2);
          const manifest = JSON.parse(fs.readFileSync(file, 'utf8'));
          if (manifest.sourceSha !== expectedSha) process.exit(1);
          if (manifest.runtimeBaseline !== 'earthcoop-knowledge-center-0.8.0') process.exit(1);
          NODE
              then
                echo "Preview deployment verified for $GITHUB_SHA on earthcoop-knowledge-center-0.8.0"
                exit 0
              fi
            fi
            sleep 5
          done
          echo "::error::Live preview verification failed after bounded retries"
          exit 1
